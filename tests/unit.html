<!doctype html>
<meta charset="utf-8">
<title>Unit tests</title>
<pre id="out">running…</pre>
<script type="module">
  import { runUnit } from './unit.js';
  runUnit().then(r => {
    window.__results = r;
    document.getElementById('out').textContent = JSON.stringify(r, null, 2);
  }).catch(e => { window.__results = { error: String(e.stack || e) }; });
</script>
